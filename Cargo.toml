[package]
name = "waysync"
version = "0.1.0"
edition = "2021"
description = "Declarative dotfile & package manager for Arch-based systems"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.15"
dialoguer = "0.11"
dirs = "6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
similar = "2"
toml = "0.8"
walkdir = "2"
